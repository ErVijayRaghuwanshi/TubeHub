<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transparent Green Screen Video</title>

  <style>
    body {
      margin: 0;
      background: #f0f0f0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 20px;
    }

    canvas {
      max-width: 100%;
      height: auto;
    }

    video {
      display: none;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="playBtn">Play With Sound</button>

  <video id="video" autoplay loop playsinline>
    <source src="demo.mp4" type="video/mp4">
    Your browser does not support video.
  </video>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('playBtn');

    let rendering = false;

    function render() {
      if (video.readyState >= 2) {
        if (
          canvas.width !== video.videoWidth ||
          canvas.height !== video.videoHeight
        ) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }

        ctx.drawImage(video, 0, 0);

        const frame = ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

        const data = frame.data;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          // Remove green background
          if (
            g > 100 &&
            g > r * 1.3 &&
            g > b * 1.3
          ) {
            data[i + 3] = 0;
          }
        }

        ctx.putImageData(frame, 0, 0);
      }

      requestAnimationFrame(render);
    }

    playBtn.addEventListener('click', async () => {
      try {
        video.muted = false;
        video.volume = 1;

        await video.play();

        if (!rendering) {
          rendering = true;
          requestAnimationFrame(render);
        }

        playBtn.style.display = 'none';
      } catch (err) {
        console.error('Playback failed:', err);
        alert('Browser blocked playback. Click again.');
      }
    });

    // Optional: autoplay muted so the canvas appears immediately
    video.muted = true;
    video.play().then(() => {
      if (!rendering) {
        rendering = true;
        requestAnimationFrame(render);
      }
    }).catch(() => {});
  </script>

</body>
</html>
